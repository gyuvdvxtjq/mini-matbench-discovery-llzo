# Conda environment for the LLZO audit.
#
# This file deliberately pins only the Python version and installs everything
# else through pip, from the single dependency manifest in pyproject.toml.
# A second hand-maintained list only guarantees the two drift apart -- which is
# what happened with the original requirements.txt (it was missing pyyaml and
# python-dotenv, both imported on the first line of mlip_audit).
#
#   conda env create -f environment.yml --override-channels
#   conda activate mini-matbench-llzo
#
# For MACE-MP-0, install the [mace] extra in this same environment:
#   pip install -e ".[mace]"
name: mini-matbench-llzo
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -e .
